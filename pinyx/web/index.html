<!doctype html>
<html>
<head>
  <meta charset='utf-8'>
  <title>PiNyx Setup</title>
  <style>
    body{font-family:sans-serif;max-width:960px;margin:20px auto}
    textarea,input{width:100%;padding:8px}
    button{padding:8px 12px;margin:8px 0}
    section{border:1px solid #ddd;padding:12px;margin-bottom:12px}
    .ok{color:#0a7a2f}.err{color:#b00020}
  </style>
</head>
<body>
<h1>PiNyx Onboarding</h1>
<section>
  <h2>Router Roles</h2>
  <label>Thinking model</label><input id='thinking' placeholder='provider/model-id'/>
  <label>Coding model</label><input id='coding' placeholder='provider/model-id'/>
  <button onclick='saveSettings()'>Save roles</button>
  <div id='smsg'></div>
</section>
<section>
  <h2>Gateway Config</h2>
  <p>Configure API keys, endpoints, models, and costs in JSON.</p>
  <textarea id='cfg' rows='26'></textarea><br/>
  <button onclick='saveConfig()'>Save config</button>
  <button onclick='syncPricing()'>Sync pricing from LiteLLM</button>
  <div id='cmsg'></div>
</section>
<script>
function setMsg(id, ok, text){ const el=document.getElementById(id); el.className=ok?'ok':'err'; el.textContent=text; }
async function load(){
  const cfgRes = await fetch('/api/config');
  const cfg = await cfgRes.json();
  document.getElementById('cfg').value = JSON.stringify(cfg,null,2);
  const stRes = await fetch('/api/settings');
  const st = await stRes.json();
  document.getElementById('thinking').value=st.thinking_model||'';
  document.getElementById('coding').value=st.coding_model||'';
}
async function saveConfig(){
  try{
    const parsed=JSON.parse(document.getElementById('cfg').value);
    const r=await fetch('/api/config',{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify(parsed)});
    const t=await r.json().catch(()=>({}));
    setMsg('cmsg', r.ok, r.ok?'Saved config':`Failed saving config: ${t?.error?.message||'unknown error'}`);
  }catch(_e){ setMsg('cmsg', false, 'Invalid JSON'); }
}
async function saveSettings(){
  const body={thinking_model:document.getElementById('thinking').value,coding_model:document.getElementById('coding').value};
  const r=await fetch('/api/settings',{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify(body)});
  const t=await r.json().catch(()=>({}));
  setMsg('smsg', r.ok, r.ok?'Saved roles':`Failed saving roles: ${t?.error?.message||'unknown error'}`);
}
async function syncPricing(){
  const r=await fetch('/api/pricing/sync',{method:'POST'});
  const t=await r.json().catch(()=>({}));
  setMsg('cmsg', r.ok, r.ok?`Synced pricing (${t.updated_models} models)`:`Sync failed: ${t?.error?.message||'unknown error'}`);
  if(r.ok){ await load(); }
}
load();
</script>
</body>
</html>
