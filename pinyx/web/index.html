<!doctype html>
<html>
<head>
<meta charset='utf-8'>
<title>PiNyx</title>
<style>
  :root {
    --bg: #0f0f0f;
    --surface: #1a1a1a;
    --border: #2a2a2a;
    --text: #e0e0e0;
    --text-dim: #888;
    --accent: #00d4aa;
    --accent-dim: #00d4aa33;
    --danger: #ff4466;
    --danger-dim: #ff446633;
    --success: #00d4aa;
    --warn: #ffaa00;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    max-width: 880px;
    margin: 0 auto;
    padding: 32px 20px;
    line-height: 1.5;
  }
  h1 {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.5px;
    margin-bottom: 4px;
  }
  h1 span { color: var(--accent); }
  .subtitle { color: var(--text-dim); margin-bottom: 32px; font-size: 14px; }
  section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 16px;
  }
  section h2 {
    font-size: 15px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text-dim);
    margin-bottom: 16px;
  }
  .provider-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
  }
  .provider-row:last-child { border-bottom: none; }
  .provider-name {
    width: 100px;
    font-weight: 600;
    font-size: 14px;
    flex-shrink: 0;
  }
  .provider-status {
    font-size: 12px;
    padding: 2px 8px;
    border-radius: 4px;
    flex-shrink: 0;
    width: 70px;
    text-align: center;
    font-weight: 500;
  }
  .status-resolved { background: var(--accent-dim); color: var(--accent); }
  .status-missing { background: var(--danger-dim); color: var(--danger); }
  .provider-hint {
    flex: 1;
    font-size: 13px;
    color: var(--text-dim);
    font-family: 'SF Mono', 'Fira Code', monospace;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .provider-input {
    width: 0;
    flex: 1;
    min-width: 0;
  }
  .provider-input input {
    width: 100%;
    padding: 6px 10px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-family: 'SF Mono', 'Fira Code', monospace;
    font-size: 13px;
    outline: none;
    transition: border-color 0.2s;
  }
  .provider-input input:focus { border-color: var(--accent); }
  .provider-input input::placeholder { color: #555; }
  button {
    padding: 7px 14px;
    border-radius: 6px;
    border: none;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.15s;
  }
  .btn-accent {
    background: var(--accent);
    color: #000;
  }
  .btn-accent:hover { opacity: 0.85; }
  .btn-accent:disabled { opacity: 0.4; cursor: default; }
  .btn-ghost {
    background: transparent;
    color: var(--text-dim);
    border: 1px solid var(--border);
  }
  .btn-ghost:hover { border-color: var(--text-dim); color: var(--text); }
  .btn-danger {
    background: var(--danger-dim);
    color: var(--danger);
  }
  .btn-danger:hover { background: var(--danger); color: #fff; }
  .action-row {
    display: flex;
    gap: 8px;
    margin-top: 12px;
    align-items: center;
  }
  .msg { font-size: 13px; padding: 4px 0; }
  .msg-ok { color: var(--accent); }
  .msg-err { color: var(--danger); }
  .msg-warn { color: var(--warn); }

  .roles-grid {
    display: grid;
    grid-template-columns: 120px 1fr;
    gap: 8px 12px;
    align-items: center;
  }
  .roles-grid label {
    font-size: 13px;
    color: var(--text-dim);
    font-weight: 500;
  }
  .roles-grid select, .roles-grid input {
    width: 100%;
    padding: 7px 10px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-size: 13px;
    outline: none;
  }
  .roles-grid select:focus, .roles-grid input:focus { border-color: var(--accent); }

  .config-section textarea {
    width: 100%;
    padding: 10px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-family: 'SF Mono', 'Fira Code', monospace;
    font-size: 12px;
    line-height: 1.6;
    resize: vertical;
    outline: none;
  }
  .config-section textarea:focus { border-color: var(--accent); }
  .health-bar {
    display: flex;
    gap: 16px;
    font-size: 13px;
    color: var(--text-dim);
  }
  .health-bar strong { color: var(--text); }

  .edit-toggle { font-size: 12px; color: var(--accent); cursor: pointer; }
  .edit-toggle:hover { text-decoration: underline; }
</style>
</head>
<body>

<h1>Pi<span>Nyx</span></h1>
<p class="subtitle">Model Gateway</p>

<div id="health-bar" class="health-bar" style="margin-bottom:20px"></div>

<section>
  <h2>API Keys</h2>
  <div id="keys-list"></div>
  <div id="kmsg" class="msg" style="margin-top:8px"></div>
</section>

<section>
  <h2>Router Roles</h2>
  <div class="roles-grid">
    <label>Thinking model</label>
    <select id="thinking"></select>
    <label>Coding model</label>
    <select id="coding"></select>
  </div>
  <div class="action-row">
    <button class="btn-accent" onclick="saveSettings()">Save roles</button>
    <div id="smsg" class="msg"></div>
  </div>
</section>

<section class="config-section">
  <h2>Advanced Config</h2>
  <details id="cfg-details">
    <summary style="color:var(--text-dim);cursor:pointer;font-size:13px;margin-bottom:12px">Edit raw JSON config</summary>
    <textarea id="cfg" rows="24"></textarea>
    <div class="action-row">
      <button class="btn-ghost" onclick="saveConfig()">Save config</button>
      <button class="btn-ghost" onclick="syncPricing()">Sync pricing</button>
      <div id="cmsg" class="msg"></div>
    </div>
  </details>
</section>

<script>
let allModels = [];
let keysData = {};
let cfgLoaded = false;

document.getElementById('cfg-details').addEventListener('toggle', async (e) => {
  if (e.target.open && !cfgLoaded) {
    try {
      const cfg = await fetch('/api/config').then(r => r.json());
      document.getElementById('cfg').value = JSON.stringify(cfg, null, 2);
      cfgLoaded = true;
    } catch {}
  }
});

async function load() {
  await Promise.all([loadHealth(), loadKeys(), loadModels(), loadSettings()]);
}

async function loadHealth() {
  try {
    const h = await fetch('/health').then(r => r.json());
    const bar = document.getElementById('health-bar');
    const provCount = Object.keys(h.providers || {}).length;
    const okCount = Object.values(h.providers || {}).filter(p => p.api_key).length;
    bar.innerHTML = `<span>v<strong>${h.version}</strong></span><span>${okCount}/${provCount} providers ready</span><span><strong>${h.gateway.host}:${h.gateway.port}</strong></span>`;
  } catch {}
}

async function loadKeys() {
  try {
    const data = await fetch('/api/keys').then(r => r.json());
    keysData = data.providers || {};
    renderKeys();
  } catch {}
}

function renderKeys() {
  const list = document.getElementById('keys-list');
  list.innerHTML = '';
  for (const [name, info] of Object.entries(keysData)) {
    const row = document.createElement('div');
    row.className = 'provider-row';

    const statusClass = info.status === 'resolved' ? 'status-resolved' : 'status-missing';
    const statusText = info.status === 'resolved' ? 'Active' : 'Missing';

    row.innerHTML = `
      <div class="provider-name">${name}</div>
      <div class="provider-status ${statusClass}">${statusText}</div>
      <div class="provider-hint" id="hint-${name}">${info.masked || (info.is_env_var ? info.ref : '—')}</div>
      <div class="provider-input" id="input-wrap-${name}" style="display:none">
        <input type="password" id="input-${name}" placeholder="Paste API key..." />
      </div>
      <button class="btn-ghost" id="edit-btn-${name}" onclick="toggleEdit('${name}')">Edit</button>
      <button class="btn-accent" id="save-btn-${name}" style="display:none" onclick="saveKey('${name}')">Save</button>
    `;
    list.appendChild(row);
  }
}

function toggleEdit(name) {
  const hint = document.getElementById('hint-' + name);
  const wrap = document.getElementById('input-wrap-' + name);
  const editBtn = document.getElementById('edit-btn-' + name);
  const saveBtn = document.getElementById('save-btn-' + name);
  const isEditing = wrap.style.display !== 'none';
  if (isEditing) {
    hint.style.display = '';
    wrap.style.display = 'none';
    editBtn.style.display = '';
    saveBtn.style.display = 'none';
  } else {
    hint.style.display = 'none';
    wrap.style.display = '';
    editBtn.style.display = 'none';
    saveBtn.style.display = '';
    document.getElementById('input-' + name).focus();
  }
}

async function saveKey(name) {
  const input = document.getElementById('input-' + name);
  const msg = document.getElementById('kmsg');
  const key = input.value.trim();
  if (!key) { msg.className = 'msg msg-err'; msg.textContent = 'Key cannot be empty'; return; }

  try {
    const r = await fetch(`/api/keys/${encodeURIComponent(name)}`, {
      method: 'PUT',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ api_key: key })
    });
    const t = await r.json();
    if (r.ok) {
      msg.className = 'msg msg-ok';
      msg.textContent = `Saved key for ${name}`;
      input.value = '';
      await loadKeys();
      await loadHealth();
    } else {
      msg.className = 'msg msg-err';
      msg.textContent = t.error?.message || 'Failed to save';
    }
  } catch (e) {
    msg.className = 'msg msg-err';
    msg.textContent = 'Network error';
  }
}

async function loadModels() {
  try {
    const data = await fetch('/v1/models').then(r => r.json());
    allModels = data.data || [];
    populateModelSelects();
  } catch {}
}

function populateModelSelects() {
  ['thinking', 'coding'].forEach(id => {
    const sel = document.getElementById(id);
    const current = sel.value;
    sel.innerHTML = '<option value="">— select —</option>';
    allModels.forEach(m => {
      const opt = document.createElement('option');
      opt.value = m.id;
      opt.textContent = m.name || m.id;
      if (m.id === current) opt.selected = true;
      sel.appendChild(opt);
    });
  });
}

async function loadSettings() {
  try {
    const st = await fetch('/api/settings').then(r => r.json());
    document.getElementById('thinking').value = st.thinking_model || '';
    document.getElementById('coding').value = st.coding_model || '';
  } catch {}
}

async function saveSettings() {
  const msg = document.getElementById('smsg');
  const body = {
    thinking_model: document.getElementById('thinking').value,
    coding_model: document.getElementById('coding').value
  };
  try {
    const r = await fetch('/api/settings', {
      method: 'PUT',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify(body)
    });
    msg.className = 'msg ' + (r.ok ? 'msg-ok' : 'msg-err');
    msg.textContent = r.ok ? 'Saved roles' : 'Failed';
  } catch {
    msg.className = 'msg msg-err'; msg.textContent = 'Network error';
  }
}

async function saveConfig() {
  const msg = document.getElementById('cmsg');
  try {
    const parsed = JSON.parse(document.getElementById('cfg').value);
    const r = await fetch('/api/config', {
      method: 'PUT',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify(parsed)
    });
    msg.className = 'msg ' + (r.ok ? 'msg-ok' : 'msg-err');
    msg.textContent = r.ok ? 'Saved config' : 'Failed';
    if (r.ok) { await loadKeys(); await loadHealth(); }
  } catch (e) {
    msg.className = 'msg msg-err'; msg.textContent = 'Invalid JSON';
  }
}

async function syncPricing() {
  const msg = document.getElementById('cmsg');
  try {
    const r = await fetch('/api/pricing/sync', { method: 'POST' });
    const t = await r.json();
    msg.className = 'msg ' + (r.ok ? 'msg-ok' : 'msg-err');
    msg.textContent = r.ok ? `Synced pricing (${t.updated_models} models)` : ('Sync failed: ' + (t.error?.message || 'unknown'));
    if (r.ok) await load();
  } catch {
    msg.className = 'msg msg-err'; msg.textContent = 'Network error';
  }
}

load();
</script>
</body>
</html>
